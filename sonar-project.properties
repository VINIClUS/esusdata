# SonarQube Cloud analysis (ADR 0019), run by the sonar job in .github/workflows/ci.yml from the
# build outputs of the java and rust jobs. Automatic Analysis is off for this project: CI analysis
# and it cannot both run.
sonar.organization=viniclus
sonar.projectKey=VINIClUS_esusdata
sonar.projectName=esusdata
sonar.sourceEncoding=UTF-8

sonar.sources=apps/agent/src/main/java,apps/web/src,apps/web/scripts,apps/execplane/src,deployment,.github/scripts
sonar.tests=apps/agent/src/test/java
# Images are not source: the scanner would read them as text.
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp

# Java: the compiled classes come from the java job; the libraries from the sonar job's own
# dependency:build-classpath, passed on the command line.
sonar.java.source=21
sonar.java.binaries=apps/agent/target/classes
sonar.java.test.binaries=apps/agent/target/test-classes
sonar.junit.reportPaths=apps/agent/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=apps/agent/target/site/jacoco/jacoco.xml

# Rust: tests live in the sources (#[cfg(test)]); coverage and Clippy come from the rust job.
# Property keys as listed by api/settings/list_definitions (clippyReport, not clippy).
sonar.rust.cargo.manifestPaths=apps/execplane/Cargo.toml
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json

# The web client has one node --test file and no coverage instrumentation, so it stays out of the
# coverage figures (a decision recorded in ADR 0019); every other rule still applies to it. The
# packaging and CI scripts are analyzed but are not code that tests cover.
sonar.coverage.exclusions=apps/web/**,deployment/**,.github/**
