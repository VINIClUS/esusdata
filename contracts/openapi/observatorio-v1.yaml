openapi: 3.0.3
info:
  title: Observatório APS
  version: v1
  description: >-
    Hand-written, not generated (see pom.xml: springdoc 2.8.6 targets Spring Framework 6 /
    Jakarta EE 10, incompatible with this project's Boot 4.1.1 / Framework 7 / EE 11). Checked
    against the routes Spring actually registers by OpenApiContractTest, in both directions.
    Routes and status codes beyond those the Tech Spec itself specifies (the whole /api/v1/auth/*
    and /api/v1/ready surface, the /api/v1/users/* administration routes, and every HTTP status
    code that is not explicitly 202/404 in §1.10) are PROJECT DECISIONS, documented in
    docs/adr/0008-superficie-http-de-autenticacao.md — never spec requirements. Likewise the
    scope-discovery reads GET /api/v1/runs, GET /api/v1/results/periods and the municipalities
    field of GET /api/v1/auth/me (docs/adr/0015-escopo-do-cliente-web-em-tempo-de-execucao.md).
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: admin
  - name: sources
  - name: runs
  - name: results
  - name: indicator-packs
  - name: exports
  - name: ready

paths:
  /api/v1/ready:
    get:
      tags: [ready]
      summary: Readiness probe; also the SPA's first request to obtain the CSRF cookie.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with username and password; sets the OBS_SESSION cookie.
      security:
        - csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid username or password (code AUTHENTICATION_FAILED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Too many failed attempts (code LOGIN_THROTTLED).
          headers:
            Retry-After:
              description: Delta-seconds (RFC 7231 §7.1.3), never an ISO-8601 instant.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: End the current session; clears the OBS_SESSION cookie.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Logged out.

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: >-
        The authenticated principal's own user id, plus the municipalities whose aggregate it may
        read (READ_CLINICAL, municipality-wide grants only) — lets the web client pick its scope
        at runtime.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }

  /api/v1/auth/activate:
    post:
      tags: [auth]
      summary: Redeem a one-time activation token and set an initial password.
      security:
        - csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateRequest" }
      responses:
        "204":
          description: Activated.
        "400":
          description: Invalid/expired token (ACTIVATION_FAILED) or weak password (WEAK_PASSWORD).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/auth/reauth:
    post:
      tags: [auth]
      summary: >-
        Re-verify the current password (§1.12.7 L539). Opens a short window in which
        MANAGE_ACCESS/MANAGE_SOURCE mutations are permitted.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "204":
          description: Reauthenticated.
        "401":
          description: Wrong password (AUTHENTICATION_FAILED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/users:
    post:
      tags: [admin]
      summary: Provision a new user account (MANAGE_ACCESS, installation scope, + recent reauth).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created. activationToken is returned exactly once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateUserResponse" }
        "401":
          description: Reauthentication required or expired (code REAUTHENTICATION_REQUIRED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Caller lacks installation-scoped MANAGE_ACCESS.
        "409":
          description: Username already exists (USERNAME_ALREADY_EXISTS).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/users/pending-activation:
    get:
      tags: [admin]
      summary: List pending accounts and code expiration, without exposing codes. Requires installation MANAGE_ACCESS.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Pending accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingActivationUser" }
        "404":
          description: Caller lacks installation MANAGE_ACCESS.

  /api/v1/users/{id}/activation-token:
    post:
      tags: [admin]
      summary: Reissue a one-time code for a pending account. Requires installation MANAGE_ACCESS and recent reauthentication.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: New code returned once; older codes invalidated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateUserResponse" }
        "400":
          description: Account is not pending activation.
        "401":
          description: Recent reauthentication required.
        "404":
          description: Unknown user, or caller lacks installation MANAGE_ACCESS.

  /api/v1/users/{id}/grants:
    post:
      tags: [admin]
      summary: >-
        Grant a role/scope to a user. Bumps the target's authorization_version and revokes all of
        their active sessions unconditionally (§1.12.7 L541).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGrantRequest" }
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResponse" }
        "400":
          description: Missing/invalid role or scopeKind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Self-grant refused (SELF_GRANT_FORBIDDEN, ENG-45).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Unknown user, or caller lacks installation-scoped MANAGE_ACCESS.

  /api/v1/users/{id}/grants/{grantId}:
    delete:
      tags: [admin]
      summary: >-
        Revoke a grant. Bumps the target's authorization_version and revokes all of their active
        sessions unconditionally (§1.12.7 L541).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: grantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        "403":
          description: Self-revoke refused (SELF_GRANT_FORBIDDEN — see AccessAdministrationService).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Unknown user/grant, or caller lacks installation-scoped MANAGE_ACCESS.

  /api/v1/users/{id}/block:
    post:
      tags: [admin]
      summary: >-
        Block a user account. Bumps authorization_version and revokes all active sessions
        unconditionally (§1.12.7 L541).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Blocked.
        "403":
          description: Self-block refused (SELF_BLOCK_FORBIDDEN — would brick the installation).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Unknown user, or caller lacks installation-scoped MANAGE_ACCESS.

  /api/v1/sources:
    get:
      tags: [sources]
      summary: >-
        Every source the caller holds MANAGE_SOURCE for, ordered by municipality then id. Narrowed,
        never refused: an installation-scoped grant sees all sources, a municipal one only its own,
        anyone else an empty list. No municipality parameter, because GET /auth/me lists only
        READ_CLINICAL municipalities and a technical admin holds none. Read-only: no recent reauth.
      responses:
        "200":
          description: OK. secretRef is a reference, never the secret value.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceResponse" }
    post:
      tags: [sources]
      summary: Register or update a PEC source configuration (MANAGE_SOURCE + recent reauth).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceRequest" }
      responses:
        "201":
          description: Registered. secretRef is a reference, never the resolved secret value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceResponse" }
        "400":
          description: Source id already belongs to a different municipality.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Caller lacks MANAGE_SOURCE for the requested municipality.

  /api/v1/sources/{id}/test:
    post:
      tags: [sources]
      summary: Connectivity/capability/budget diagnostic against a registered source.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Diagnostic result. detail never contains the secret. Every outcome but SOURCE_BUSY is
            stored as the source's lastDiagnostic for its current configuration version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceTestResponse" }
        "404":
          description: Unknown source, or caller lacks MANAGE_SOURCE for its municipality.

  /api/v1/sources/{id}/isolation-check:
    post:
      tags: [sources]
      summary: >-
        Municipal isolation check (ADR 0023): counts one competência's atendimentos individuais in
        the source's PEC per tb_dim_municipio.co_ibge, through the execution plane and the same
        compatibility handshake as an acquisition, and compares them with the registered
        municipality. Aggregate counts only; MANAGE_SOURCE and a recent reauth.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IsolationCheckRequest" }
      responses:
        "200":
          description: >-
            Check result. Every outcome but SOURCE_BUSY is stored as the source's
            lastIsolationCheck for its current configuration version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IsolationCheck" }
        "400":
          description: >-
            referencePeriod is missing or not an ISO year-month (yyyy-MM), or the source is not a
            PEC source with a complete identity (version, read model, installation role).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: The session has no recent reauthentication.
        "404":
          description: Unknown source, or caller lacks MANAGE_SOURCE for its municipality.

  /api/v1/sources/{id}/coverage-check:
    post:
      tags: [sources]
      summary: >-
        Competência coverage check (ADR 0027): counts the atendimentos individuais of the last 24
        closed competências plus the current one in the source's PEC per tb_dim_municipio.co_ibge
        and month, through the execution plane and the same compatibility handshake as an
        acquisition, and keeps the registered municipality's months. Aggregate counts only;
        MANAGE_SOURCE and a recent reauth.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            Check result. Every outcome but SOURCE_BUSY is stored as the source's lastCoverage for
            its current configuration version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "400":
          description: The source is not a PEC source with a complete identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: The session has no recent reauthentication.
        "404":
          description: Unknown source, or caller lacks MANAGE_SOURCE for its municipality.

  /api/v1/sources/{id}/requirements:
    get:
      tags: [sources]
      summary: >-
        The requirements a registered source meets, from its registration, its last diagnostic and
        the packaged PEC compatibility matrix (MANAGE_SOURCE; read-only, no recent reauth). Each
        code claims only what it checks — READ_CONNECTION means the last diagnostic under the
        current configuration was CONNECTED, not that the account is SELECT-only;
        PEC_VERSION_IN_MATRIX means the PEC version, read model and installation role appear in a
        VALIDATED entry, not the exact capability/PostgreSQL entry acquisition still requires.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK, in a fixed order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceRequirementResponse" }
        "404":
          description: Unknown source, or caller lacks MANAGE_SOURCE for its municipality.

  /api/v1/runs:
    get:
      tags: [runs]
      summary: >-
        A municipality's most recent jobs, newest first (RUN_INDICATOR, same scope as
        GET /runs/{id}). Project decision (ADR 0015): lets the web client find the current run
        without a configured job id. Does not advance session inactivity (ENG-44).
      parameters:
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunResponse" }
        "400":
          description: limit out of range (BAD_REQUEST).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Caller lacks RUN_INDICATOR for the requested municipality.
    post:
      tags: [runs]
      summary: Enqueue a run (§1.10, ENG-05/ENG-24 idempotent via Idempotency-Key).
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunRequest" }
      responses:
        "202":
          description: Accepted.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResponse" }
        "400":
          description: Missing/invalid field (BAD_REQUEST).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Caller lacks RUN_INDICATOR for the requested municipality.
        "409":
          description: >-
            Idempotency-Key reused with a different payload (IDEMPOTENCY_KEY_CONFLICT), or another
            live job for the same source, município, pack and competência is still active
            (ACTIVE_JOB_EXISTS, ADR 0026; `jobId` names it).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ApiError" }
                  - { $ref: "#/components/schemas/ActiveJobError" }

  /api/v1/runs/{id}:
    get:
      tags: [runs]
      summary: >-
        Current job state — "a consulta do job é a fonte de verdade" (§1.10 L397). Does not
        advance session inactivity (ENG-44).
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResponse" }
        "404":
          description: Unknown job, or out of the caller's scope (identical response, §1.10.1 L403).

  /api/v1/runs/{id}/cancel:
    post:
      tags: [runs]
      summary: Request cooperative cancellation (§1.9.4). Idempotent while already cancelling.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Cancel accepted or already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResponse" }
        "404":
          description: Unknown job, or out of the caller's scope.
        "409":
          description: Job is already terminal (JOB_NOT_CANCELLABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/runs/{id}/events:
    get:
      tags: [runs]
      summary: >-
        SSE stream of run progress (project decision — not specified by the Tech Spec; see ADR
        0008). Polls the job repository; never replays past events on reconnect, only current
        state (§1.10 L397). A heartbeat comment is sent on every reauthorization tick. Does not
        advance session inactivity (ENG-44).
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: >-
            text/event-stream. Named "run" events carry a RunResponse JSON payload, sent only when
            state/attempt/lastProgressAt or persisted attempt history changes; unnamed comment
            lines (": keep-alive") are sent on every reauthorization tick that still finds the
            session and scope valid. The stream ends (graceful close, no error) when the session or
            the RUN_INDICATOR grant for the job's municipality is no longer valid.
          content:
            text/event-stream:
              schema: { type: string }
        "404":
          description: Unknown job, or out of the caller's scope.
        "503":
          description: Too many concurrent event streams (TOO_MANY_EVENT_STREAMS).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /api/v1/results:
    get:
      tags: [results]
      summary: Published results for a municipality/indicator/period (READ_CLINICAL).
      parameters:
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
        - name: indicatorPack
          in: query
          required: true
          schema: { type: string }
        - name: referencePeriod
          in: query
          required: true
          schema: { type: string, example: "2026-03" }
      responses:
        "200":
          description: OK. Never recomputes — reads only result-store (L306).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultResponse" }
        "404":
          description: Caller lacks READ_CLINICAL for the requested municipality.

  /api/v1/exports:
    post:
      tags: [exports]
      summary: >-
        Aggregate CSV export of published results (ADR 0024): the newest published result of each
        indicator pack and competência in [fromPeriod, toPeriod]. Generated synchronously from
        SQLite, never from the PEC, and kept for 7 days. READ_CLINICAL for the whole municipality;
        no recent reauth, since it holds no record. Audited as EXPORT_CREATED.
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportRequest" }
      responses:
        "201":
          description: Created. rowCount may be 0 when nothing was published in the range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "400":
          description: >-
            A period is missing or not yyyy-MM, fromPeriod is after toPeriod, the range spans more
            than 24 competências, or the indicator pack is unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Caller lacks READ_CLINICAL for the whole municipality.
        "429":
          description: The caller already created 10 exports in the last hour (EXPORT_QUOTA_EXCEEDED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    get:
      tags: [exports]
      summary: >-
        The municipality's unexpired exports, newest first, at most 20 — every creator's, not only
        the caller's (READ_CLINICAL).
      parameters:
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Export" }
        "404":
          description: Caller lacks READ_CLINICAL for the requested municipality.

  /api/v1/exports/{id}/content:
    get:
      tags: [exports]
      summary: >-
        Downloads the CSV: UTF-8 with a BOM, ';' between cells, CRLF, every cell quoted, and a
        cell starting with = + - @, tab or CR prefixed with an apostrophe (ENG-48). The scope is
        checked again on every download; audited as EXPORT_DOWNLOADED.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: >-
            The file, as an attachment with a server-chosen name and Cache-Control no-store.
            Columns: municipio_ibge, indicador, versao_regra, competencia, status, numerador,
            denominador, valor_percentual (decimal comma, empty without a denominator),
            classificacao, data_corte, publicado_em, execucao.
          content:
            text/csv:
              schema: { type: string, format: binary }
        "404":
          description: >-
            Unknown export, another municipality's, expired, or the caller lacks READ_CLINICAL for
            the municipality — the same response for all four.

  /api/v1/results/periods:
    get:
      tags: [results]
      summary: >-
        Reference periods with at least one published result in the municipality, newest first
        (READ_CLINICAL). Project decision (ADR 0015): lets the web client default to the latest
        competência instead of a configured one.
      parameters:
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { type: string, example: "2026-03" }
        "404":
          description: Caller lacks READ_CLINICAL for the requested municipality.

  /api/v1/results/{id}/evidence:
    get:
      tags: [results]
      summary: >-
        One page of the minimal evidence backing a result. A team-scoped (CNES/INE) grant is
        enough to reach this route — rows are narrowed to the caller's team, never rejected
        outright (§1.12 L427); only the municipal aggregate above requires a municipality-wide
        grant.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: municipalityIbge
          in: query
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          description: Opaque, HMAC-authenticated; bound to this result/ordering/scope (§1.10.1 L405).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceResponse" }
        "400":
          description: Malformed, expired, or scope/ordering-mismatched cursor (INVALID_CURSOR).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Unknown result, or caller holds no grant at all for the municipality.

  /api/v1/indicator-packs:
    get:
      tags: [indicator-packs]
      summary: >-
        Catalog of indicator packs (§1.10 L385). Any authenticated session may read it; being
        listed does not enable execution (ENG-34) — C1's gates A/B/D/E remain blocked.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndicatorPackResponse" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: OBS_SESSION
      description: >-
        Opaque session token, never Spring's HttpSession-backed JSESSIONID. State-changing
        requests also require the CSRF double-submit pair: an XSRF-TOKEN cookie (set by any GET,
        e.g. /ready) echoed back in the X-XSRF-TOKEN header.
    csrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
      description: >-
        CSRF token cookie issued by a GET such as /api/v1/ready. State-changing requests must
        echo its value in X-XSRF-TOKEN.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: CSRF token header matching the XSRF-TOKEN cookie.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    ActiveJobError:
      type: object
      required: [code, message, jobId]
      properties:
        code: { type: string, enum: [ACTIVE_JOB_EXISTS] }
        message: { type: string }
        jobId: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }

    MeResponse:
      type: object
      properties:
        userId: { type: string }
        canManageAccess: { type: boolean, description: Installation-scoped MANAGE_ACCESS capability. }
        municipalities:
          type: array
          items: { type: string }

    ActivateRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string }

    ReauthRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    CreateUserRequest:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string }
        displayName: { type: string }

    CreateUserResponse:
      type: object
      properties:
        userId: { type: string }
        activationToken:
          type: string
          description: Returned exactly once, at creation.
        expiresAt: { type: string, format: date-time }

    PendingActivationUser:
      type: object
      required: [userId, username, displayName]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }

    CreateGrantRequest:
      type: object
      oneOf:
        - $ref: "#/components/schemas/MunicipalityGrantRequest"
        - $ref: "#/components/schemas/InstallationGrantRequest"
      discriminator:
        propertyName: scopeKind
        mapping:
          MUNICIPALITY: "#/components/schemas/MunicipalityGrantRequest"
          INSTALLATION: "#/components/schemas/InstallationGrantRequest"

    MunicipalityGrantRequest:
      type: object
      additionalProperties: false
      required: [role, scopeKind, municipalityIbge]
      properties:
        role: { type: string, enum: [TECHNICAL_ADMIN, MANAGER, TEAM_SCOPED_PROFESSIONAL, AUDITOR] }
        scopeKind: { type: string, enum: [MUNICIPALITY] }
        municipalityIbge:
          type: string
          pattern: "^[0-9]{7}$"
        cnes:
          type: string
          nullable: true
          description: Narrows the grant to one team; null grants municipality-wide (§1.12 L427).
        ine: { type: string, nullable: true }

    InstallationGrantRequest:
      type: object
      additionalProperties: false
      required: [role, scopeKind]
      properties:
        role: { type: string, enum: [TECHNICAL_ADMIN, MANAGER, TEAM_SCOPED_PROFESSIONAL, AUDITOR] }
        scopeKind: { type: string, enum: [INSTALLATION] }

    GrantResponse:
      type: object
      properties:
        grantId: { type: string }
        userId: { type: string }
        role: { type: string }
        scopeKind: { type: string }
        municipalityIbge: { type: string, nullable: true }
        cnes: { type: string, nullable: true }
        ine: { type: string, nullable: true }
        grantedAt: { type: string, format: date-time }
        grantedBy: { type: string }

    CreateSourceRequest:
      type: object
      required: [id, sourceFamily, host, port, databaseName, dbUser, secretRef, municipalityIbge]
      properties:
        id: { type: string }
        sourceFamily:
          type: string
          enum: [PEC_POSTGRESQL, EXTERNAL_DATASET]
          example: PEC_POSTGRESQL
        pecInstallationRole:
          type: string
          nullable: true
          enum: [PRONTUARIO, CENTRALIZADOR, UNKNOWN]
        sourceLocationKind:
          type: string
          nullable: true
          enum: [PRIMARY, READ_REPLICA, RESTORED_COPY, INSTITUTIONAL_DW]
        host: { type: string }
        port: { type: integer }
        databaseName: { type: string }
        dbUser: { type: string }
        secretRef: { type: string }
        municipalityIbge: { type: string }
        pecVersion: { type: string }
        readModel:
          type: string
          nullable: true
          enum: [PEC_DW, PEC_OLTP]

    SourceResponse:
      allOf:
        - $ref: "#/components/schemas/CreateSourceRequest"
        - type: object
          properties:
            sourceConfigurationVersion: { type: integer }
            createdAt: { type: string, format: date-time }
            lastDiagnostic:
              allOf:
                - $ref: "#/components/schemas/LastDiagnostic"
              nullable: true
              description: >-
                Null until a diagnostic ran against the current configuration version —
                re-registering a source hides the previous one. Always null from POST /sources.
            lastIsolationCheck:
              allOf:
                - $ref: "#/components/schemas/IsolationCheck"
              nullable: true
              description: >-
                Null until an isolation check ran against the current configuration version. Always
                null from POST /sources.
            lastCoverage:
              allOf:
                - $ref: "#/components/schemas/Coverage"
              nullable: true
              description: >-
                Null until a coverage check ran against the current configuration version. Always
                null from POST /sources.

    Coverage:
      type: object
      properties:
        windowFrom: { type: string, example: "2024-09", description: First competência counted. }
        windowToExclusive: { type: string, example: "2026-10" }
        outcome:
          type: string
          enum: [DESTINATION_NOT_ALLOWED, SOURCE_BUSY, SOURCE_AUTHENTICATION_FAILED,
                 SOURCE_PERMISSION_DENIED, CONNECTION_FAILED, COMPATIBILITY_MISMATCH,
                 SOURCE_BUDGET_EXCEEDED, CHECKED]
        periods:
          type: array
          description: >-
            The registered municipality's competências with at least one atendimento, newest
            first. Empty unless outcome is CHECKED.
          items:
            type: object
            properties:
              referencePeriod: { type: string, example: "2026-03" }
              count: { type: integer, format: int64 }
        checkedAt: { type: string, format: date-time }

    LastDiagnostic:
      type: object
      properties:
        outcome:
          type: string
          enum: [DESTINATION_NOT_ALLOWED, SOURCE_AUTHENTICATION_FAILED, SOURCE_PERMISSION_DENIED,
                 CONNECTION_FAILED, CONNECTED]
        detail:
          type: string
          nullable: true
          description: Never contains the secret (§1.12.7 L550).
        testedAt: { type: string, format: date-time }

    CreateExportRequest:
      type: object
      required: [municipalityIbge, fromPeriod, toPeriod]
      properties:
        municipalityIbge: { type: string, example: "3541307" }
        fromPeriod: { type: string, example: "2026-01", description: First competência (yyyy-MM), inclusive. }
        toPeriod: { type: string, example: "2026-03", description: Last competência (yyyy-MM), inclusive. }
        indicatorPack:
          type: string
          nullable: true
          description: One pack from GET /indicator-packs; null or blank exports every pack.

    Export:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string, example: "esusdata-3541307-todos-2026-01_2026-03.csv" }
        municipalityIbge: { type: string }
        indicatorPack: { type: string, nullable: true, description: Null when every pack is exported. }
        fromPeriod: { type: string, example: "2026-01" }
        toPeriod: { type: string, example: "2026-03" }
        format: { type: string, enum: [CSV] }
        rowCount: { type: integer, description: One row per indicator pack and competência. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    IsolationCheckRequest:
      type: object
      required: [referencePeriod]
      properties:
        referencePeriod: { type: string, example: "2026-03", description: Competência to count (yyyy-MM). }

    IsolationCheck:
      type: object
      description: >-
        The counts are atendimentos of referencePeriod aggregated per municipality code, null
        unless outcome is CHECKED. They say nothing about data quality, CNES/INE or territory.
      properties:
        referencePeriod: { type: string, example: "2026-03" }
        outcome:
          type: string
          enum: [DESTINATION_NOT_ALLOWED, SOURCE_BUSY, SOURCE_AUTHENTICATION_FAILED,
                 SOURCE_PERMISSION_DENIED, CONNECTION_FAILED, COMPATIBILITY_MISMATCH,
                 SOURCE_BUDGET_EXCEEDED, CHECKED]
        registeredCount:
          type: integer
          format: int64
          nullable: true
          description: Atendimentos whose co_ibge is the source's municipality.
        otherMunicipalityCount:
          type: integer
          format: int64
          nullable: true
          description: Atendimentos under another 7-digit co_ibge — an acquisition leaves them out.
        otherMunicipalityCodes:
          type: integer
          nullable: true
          description: How many distinct other municipality codes those were.
        unidentifiedCount:
          type: integer
          format: int64
          nullable: true
          description: Atendimentos whose municipality row has no 7-digit co_ibge.
        checkedAt: { type: string, format: date-time }

    SourceRequirementResponse:
      type: object
      properties:
        code:
          type: string
          enum: [READ_CONNECTION, PEC_POSTGRESQL_FAMILY, PEC_VERSION_IN_MATRIX, MUNICIPAL_SCOPE]
        ok: { type: boolean }

    SourceTestResponse:
      type: object
      properties:
        outcome: { type: string }
        detail:
          type: string
          description: Never contains the secret (§1.12.7 L550).
        maxRows: { type: integer, format: int64 }
        maxDurationMs: { type: integer, format: int64 }
        statementTimeoutMs: { type: integer, format: int64 }

    CreateRunRequest:
      type: object
      description: >-
        sourceId is always required, in both acquisition modes — results.source_id is NOT NULL
        even for a replayed extract. extractionId, when present, only SELECTS IMMUTABLE_EXTRACT
        replay over a fresh LIVE_READ_ONLY acquisition.
      required: [municipalityIbge, indicatorPack, ruleVersion, referencePeriod, sourceId]
      properties:
        municipalityIbge: { type: string }
        indicatorPack: { type: string }
        ruleVersion: { type: string }
        referencePeriod: { type: string, example: "2026-03" }
        sourceId: { type: string }
        extractionId: { type: string, nullable: true }

    AttemptResponse:
      type: object
      properties:
        attempt: { type: integer }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        outcome: { type: string, nullable: true }
        failureCode: { type: string, nullable: true }
        failureDetail: { type: string, nullable: true }

    RunResponse:
      type: object
      properties:
        jobId: { type: string }
        runId: { type: string }
        state:
          type: string
          enum: [QUEUED, RUNNING, STAGED, CANCEL_REQUESTED, CANCELLED, SUCCEEDED, FAILED]
        attempt: { type: integer }
        maxAttempts: { type: integer }
        municipalityIbge: { type: string }
        indicatorPack: { type: string }
        ruleVersion: { type: string }
        referencePeriod: { type: string }
        sourceId: { type: string, nullable: true }
        extractionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        lastProgressAt: { type: string, format: date-time, nullable: true }
        failureCode:
          type: string
          nullable: true
          description: One of FailureClassifier's distinguishable codes (§1.10 L399) — never generic.
        failureDetail: { type: string, nullable: true }
        resultId: { type: string, nullable: true }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/AttemptResponse" }

    ScopeResponse:
      type: object
      description: >-
        cnes/ine are always null on a municipal aggregate today — results (V1/V2) carries only
        municipality_ibge; team-grained aggregates are out of this recorte's scope.
      properties:
        municipalityIbge: { type: string }
        cnes: { type: string, nullable: true }
        ine: { type: string, nullable: true }

    ResultResponse:
      type: object
      description: >-
        value/numerator/denominator travel as canonical decimal STRINGS (§1.7.1 L245, ENG-26) —
        never JSON numbers. value == null is distinct from value == "0".
      properties:
        resultId: { type: string }
        jobId: { type: string }
        runId: { type: string }
        extractionId: { type: string }
        adapterVersion: { type: string }
        calculationPolicyVersion: { type: string }
        inputFingerprint: { type: string }
        indicatorPack: { type: string }
        ruleVersion: { type: string }
        scope: { $ref: "#/components/schemas/ScopeResponse" }
        referencePeriod: { type: string }
        status: { type: string, description: e.g. BLOCKED — never a fabricated 0% result. }
        value: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        numerator: { type: string, nullable: true }
        denominator: { type: string, nullable: true }
        denominatorKind: { type: string, nullable: true }
        classification: { type: string, nullable: true }
        dataCutoff: { type: string, nullable: true }
        limitations:
          type: array
          items: { type: string }
        sourceRefs:
          type: array
          items: { type: string }
        resultNature: { type: string, example: LOCAL_ESTIMATE }
        validationStatus: { type: string, example: NOT_VALIDATED }
        completenessStatus: { type: string, nullable: true }
        consistencyLevel: { type: string, nullable: true }
        reproducibilityLevel: { type: string, nullable: true }
        canonicalSchemaVersion: { type: string, nullable: true }
        evidenceGrain: { type: string, nullable: true }
        appBuild: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }

    EvidenceEntryResponse:
      type: object
      description: One minimal evidence row (§1.12.1) — no name, CPF or CNS. The raw seq is never exposed.
      properties:
        sourceEntityType: { type: string }
        sourceRecordId: { type: string }
        careDate: { type: string, nullable: true }
        modality: { type: string, nullable: true }
        cnes: { type: string, nullable: true }
        ine: { type: string, nullable: true }
        cbo: { type: string, nullable: true }
        decision: { type: string, nullable: true }
        criterionVersion: { type: string, nullable: true }

    EvidenceResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EvidenceEntryResponse" }
        nextCursor:
          type: string
          nullable: true
          description: Opaque; null on the last page.

    IndicatorPackResponse:
      type: object
      properties:
        id: { type: string }
        ruleVersion: { type: string }
        family: { type: string }
        unit: { type: string, nullable: true }
        dependsOn:
          type: array
          items: { type: string }
        executionEnabled:
          type: boolean
          description: Being listed does not imply this is true (ENG-34).
        blockedGates:
          type: array
          items: { type: string }
