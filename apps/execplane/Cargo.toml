[package]
name = "observatorio-execplane"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "observatorio-execplane"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
chrono = "0.4"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# Compresses the extract data file — fatia 3 moves the file's whole byte pipeline into this
# process (ADR 0011). Default features use the pure-Rust miniz_oxide backend, matching this
# binary's existing no-C-dependency posture.
flate2 = "1.1"
# Cross-platform free-disk-space check, mirroring Files.getFileStore(dir).getUsableSpace() in
# ExtractWriter.ensureTempSpace. Only the (default) "sync" feature is used.
fs4 = "1.1"
# TLS with certificate validation to a source reached over a network (ADR 0022). rustls with the
# ring provider only — no aws-lc-rs, no OpenSSL. tls12 stays on: the PEC runs PostgreSQL 9.6.
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }

[dev-dependencies]

# Static-analysis gate (ADR 0018): CI runs `cargo clippy --all-targets -- -D warnings`, so every
# warning below fails the build. A single exception is `#[expect(clippy::…, reason = "…")]` at
# the site, never a blanket allow.
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
