[package]
name = "observatorio-execplane"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "observatorio-execplane"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
chrono = "0.4"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
