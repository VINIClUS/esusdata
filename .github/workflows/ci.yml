# Static-analysis gate (ADR 0018): formatting, Error Prone, PMD, rustfmt and Clippy on every push
# and pull request. No branch or path filters, so a required check never waits on a run that was
# filtered out. Tests stay in package.yml, which runs them against the binary it packages. Actions
# are pinned by commit SHA and the Rust toolchain by version (§1.12.8).
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify without tests still compiles main and test sources, so Error Prone and javac's
      # -Werror cover both; Spotless and PMD are bound to verify.
      - name: Spotless, Error Prone, PMD
        run: mvn -B -f apps/agent/pom.xml verify -DskipTests

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: rustfmt
        run: cargo fmt --manifest-path apps/execplane/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/execplane/Cargo.toml --locked --all-targets -- -D warnings
