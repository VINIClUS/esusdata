# Builds the jpackage installers (ADR 0014, Tech Spec §1.12.5): each package is built on its own
# OS, the .deb is installed and taken through its lifecycle on a real systemd runner, the CycloneDX
# inventories of what ships are validated and scanned (ADR 0019, §1.12.8), and a v* tag turns the
# result into a draft GitHub Release with build provenance and a signed manifest (ADR 0021). Actions are pinned by commit SHA, tools by version and hash,
# and the Rust toolchain by version (§1.12.8).
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'deployment/**'
      - '.trivyignore.yaml'
      - 'apps/agent/**'
      - 'apps/execplane/**'
      - 'apps/web/**'
      - 'contracts/**'
      # Controls the bytes of the checksummed contract files embedded in both packages.
      - '.gitattributes'
      - '.github/workflows/package.yml'

permissions:
  contents: read

# A re-pushed tag must not race the previous run into creating the same release.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_TOOLCHAIN: '1.98.1'
  # mirror.gcr.io first: ghcr.io rate-limits the anonymous database pulls of shared runners.
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # check-latest: the runner's cached JDK may trail the newest Temurin update.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          cache: maven
      # The runtime ships cut from this JDK; Trivy cannot match it, so it must be the newest update.
      - name: JDK is current
        run: deployment/sbom/check-jdk-current.sh linux
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Execution plane tests
        run: cargo test --release --locked --manifest-path apps/execplane/Cargo.toml
      # Full verify, including ExecPlaneDifferentialLiveTest against the binary being packaged
      # (Testcontainers uses the runner's Docker).
      - name: Package
        run: deployment/jpackage/package-linux.sh
      - name: Smoke test app image
        run: deployment/jpackage/smoke-app-image.sh
      - name: Inspect deb
        run: |
          dpkg-deb -I target/jpackage/*.deb
          dpkg -c target/jpackage/*.deb | grep -v '/lib/runtime/'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observatorio-aps-linux-deb
          path: target/jpackage/*.deb
          if-no-files-found: error
      # Inventories of the build above: backend (runtime and build plugins), frontend, execution
      # plane and runtime.
      - name: SBOMs
        run: |
          deployment/sbom/install-tool.sh cargo-cyclonedx "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" deployment/sbom/generate-sboms.sh linux target/sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-linux
          path: target/sbom/*.cdx.json
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          cache: maven
      - name: JDK is current
        shell: bash
        run: deployment/sbom/check-jdk-current.sh windows
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN
      - name: Execution plane tests
        shell: pwsh
        run: cargo test --release --locked --manifest-path apps/execplane/Cargo.toml
      # jpackage 21 drives WiX 3 (candle/light). Installed explicitly rather than trusting the
      # runner image to still carry it.
      - name: WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
      # Verify without the "docker" tests: the runner cannot start Linux containers (the linux
      # job runs them).
      - name: Package
        shell: pwsh
        run: deployment/jpackage/package-windows.ps1
      - name: Smoke test app image
        shell: bash
        run: deployment/jpackage/smoke-app-image.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observatorio-aps-windows-msi
          path: target/jpackage/*.msi
          if-no-files-found: error
      # The Windows runtime: the JDK jlink cut it from, plus WinSW.
      - name: SBOM
        shell: bash
        run: deployment/sbom/generate-sboms.sh windows target/sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-windows
          path: target/sbom/*.cdx.json
          if-no-files-found: error

  # The runner is a disposable VM with systemd and passwordless sudo: install for real.
  deb-lifecycle:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: observatorio-aps-linux-deb
          path: dist
      # The runner image's package lists are as old as the image; dependencies must resolve.
      - name: Refresh apt lists
        run: sudo apt-get update
      - name: Install, run, reinstall, remove, purge
        run: sudo deployment/jpackage/test-deb-lifecycle.sh dist/*.deb

  # Same for the MSI: the runner is a disposable VM where the job runs as an administrator.
  msi-lifecycle:
    needs: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: observatorio-aps-windows-msi
          path: dist
      - name: Install, run, reinstall, uninstall
        shell: pwsh
        run: deployment/jpackage/test-msi-lifecycle.ps1 (Get-Item dist/*.msi).FullName

  # §1.12.8 on every packaging run, not only on tags: each inventory must be valid CycloneDX 1.5,
  # and no HIGH or CRITICAL vulnerability in what ships may lack a .trivyignore.yaml entry.
  sbom:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom
      - name: Tools
        run: |
          deployment/sbom/install-tool.sh cyclonedx "$RUNNER_TEMP/bin"
          deployment/sbom/install-tool.sh trivy "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Expected inventories
        working-directory: sbom
        run: |
          for part in backend backend-build frontend-runtime frontend-build execplane-runtime \
            execplane-build runtime-linux runtime-windows; do
            test -s "$part.cdx.json" || { echo "missing SBOM: $part" >&2; exit 1; }
          done
      - name: Validate
        working-directory: sbom
        run: |
          for f in *.cdx.json; do
            cyclonedx validate --input-file "$f" --input-format json --input-version v1_5 --fail-on-errors
          done
      - name: Vulnerabilities
        working-directory: sbom
        run: |
          for f in *.cdx.json; do
            echo "== $f"
            trivy sbom "$f" --severity HIGH,CRITICAL --ignorefile ../.trivyignore.yaml --exit-code 1
          done

  # Draft only: live acquisition on Windows is tested only against a test PEC by hand (ADR 0014),
  # so a person reviews the notes before publishing.
  #
  # The signing key lives only in the "release" environment, which admits v* tags alone: no pull
  # request or branch build can read it (§1.12.8).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, deb-lifecycle, msi-lifecycle, sbom]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the project version
        id: version
        run: |
          version="$(sed -n '/<artifactId>esusdata-agent<\/artifactId>/,/<version>/s:.*<version>\(.*\)</version>.*:\1:p' apps/agent/pom.xml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match apps/agent/pom.xml version $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: observatorio-aps-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom
      - name: Name the SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in sbom/*.cdx.json; do
            cp -- "$f" "dist/observatorio-aps-$VERSION-$(basename "$f")"
          done
      # SLSA build provenance for every distributed file: commit, tag, workflow and runner, signed
      # through Sigstore and recorded in GitHub's attestation store. The toolchains reach it
      # through the pinned workflow (RUST_TOOLCHAIN, setup-java); no SLSA level is claimed.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.deb
            dist/*.msi
            dist/*.cdx.json
      # The bundle ships too, so `gh attestation verify --bundle` works offline.
      - name: Provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: cp -- "$BUNDLE" "dist/observatorio-aps-$VERSION.intoto.jsonl"
      # §1.12.8: the manifest covers every distributed file, inventories and attestation included.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.deb *.msi *.cdx.json *.intoto.jsonl >SHA256SUMS
          cat SHA256SUMS
      # §1.12.8: a signature of the manifest that verifies offline against a trusted fingerprint
      # (deployment/release/allowed_signers). Checked here against the committed trust store
      # before anything is published.
      - name: Sign the manifest
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          ssh-keygen -Y sign -q -f "$key" -n file SHA256SUMS
          ssh-keygen -Y verify -f ../deployment/release/allowed_signers -I release@observatorio-aps \
            -n file -s SHA256SUMS.sig <SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat >notes.md <<'MD'
          ## Instalação

          - **Linux (testado no Ubuntu 24.04; exige `libasound2t64`, Ubuntu 24.04+ / Debian 13)**: `sudo apt install ./observatorio-aps_*_amd64.deb`
            — serviço systemd `observatorio-aps`, dados em `/var/lib/observatorio-aps`, configuração
            local em `/etc/observatorio-aps/application.yml`.
          - **Windows 10/11 (.msi, testado no Windows Server 2022 e Windows 11)**: instale como
            administrador — serviço do Windows `observatorio-aps` (conta LocalService), dados em
            `C:\ProgramData\ObservatorioAPS\data`, configuração local em
            `C:\ProgramData\ObservatorioAPS\config\application.yml` e atalho "Observatorio APS"
            no Menu Iniciar para o cliente web.

          ## Verificação

          1. Assinatura do manifesto, com o `allowed_signers` obtido do repositório
             (`deployment/release/allowed_signers`, chave `ED25519 SHA256:3hEgZjgEAOSxIqmjY6NoZ+1nViyKrRyymNq/zppeXrA`, nunca de um download
             ao lado do instalador); `ssh-keygen` vem no Linux e no Windows 10+:

             ```
             ssh-keygen -Y verify -f allowed_signers -I release@observatorio-aps -n file -s SHA256SUMS.sig < SHA256SUMS
             ```
          2. Os arquivos contra o manifesto: `sha256sum -c SHA256SUMS`.
          3. Proveniência do build (commit, tag e workflow):
             `gh attestation verify <arquivo> -R VINIClUS/esusdata`, ou offline com
             `--bundle observatorio-aps-*.intoto.jsonl`.

          ## Inventário (SBOM)

          Arquivos `*.cdx.json` em CycloneDX 1.5, validados e verificados contra vulnerabilidades
          HIGH/CRITICAL no build: backend (runtime e plugins de build), frontend (runtime e build),
          plano de execução (runtime e build) e runtime Java de cada plataforma (Windows inclui o
          WinSW; o JDK é o update Temurin mais recente na data do build).
          MD
          assets=(dist/*.deb dist/*.msi dist/*.cdx.json dist/*.intoto.jsonl dist/SHA256SUMS
            dist/SHA256SUMS.sig)
          # gh creates the draft and uploads the assets in separate calls, so a re-run may find
          # the draft already there: refresh its assets, but never touch a published release.
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "Observatório APS $VERSION" --notes-file notes.md "${assets[@]}"
          fi
