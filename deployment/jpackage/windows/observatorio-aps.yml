# Windows platform defaults, shipped inside the app image (ADR 0014). The launcher loads this file
# first and C:/ProgramData/ObservatorioAPS/config/application.yml after it, so anything set there
# wins. Never edit this copy in place: an upgrade replaces it.
#
# The service runs as LocalService, which can write only under data\ and logs\ (ADR 0014).
observatorio:
  data:
    directory: C:/ProgramData/ObservatorioAPS/data
  source:
    secret-file: C:/ProgramData/ObservatorioAPS/config/pec.env
  execution-plane:
    # ADR 0010: the Rust execution plane ships inside the app image and is on by default (ADR 0014).
    # Turn it off with `binary: ""` in the config directory's application.yml.
    binary: ${observatorio.install-dir}/observatorio-execplane.exe

# §1.4: individual installation by default.
server:
  address: 127.0.0.1

logging:
  file:
    name: C:/ProgramData/ObservatorioAPS/logs/observatorio-aps.log
